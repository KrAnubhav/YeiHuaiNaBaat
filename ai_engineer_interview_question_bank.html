let activeFilter = 'all';

function setFilter(f, el) {
  activeFilter = f;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  el.classList.add('active');
  render();
}

const sectionStates = {};
sections.forEach(s => sectionStates[s.id] = true);

function toggleSection(id) {
  sectionStates[id] = !sectionStates[id];
  render();
}

function render() {
  const query = document.getElementById('search').value.toLowerCase();
  const content = document.getElementById('content');
  let totalVisible = 0;
  let html = '';

  sections.forEach(s => {
    let filtered = s.questions.filter(q => {
      const matchesSearch = !query || q.text.toLowerCase().includes(query);
      const matchesFilter = activeFilter === 'all' ||
        (activeFilter === 'hot' && q.tags.includes('hot')) ||
        (activeFilter === 'resume' && q.tags.includes('resume')) ||
        (activeFilter === 'design' && q.tags.includes('design'));
      return matchesSearch && matchesFilter;
    });

    if (filtered.length === 0) return;
    totalVisible += filtered.length;
    const isOpen = sectionStates[s.id];

    html += `<div class="section">
      <div class="section-header" onclick="toggleSection('${s.id}')">
        <span class="section-badge ${s.badge}">${s.badgeText}</span>
        <span class="section-title">${s.title}</span>
        <span class="section-count">${filtered.length} questions</span>
        <span class="chevron ${isOpen ? 'open' : ''}">&#8964;</span>
      </div>
      <ul class="q-list ${isOpen ? '' : 'hidden'}">`;

    filtered.forEach((q, i) => {
      const tagHtml = [
        q.tags.includes('hot') ? '<span class="q-tag tag-hot">🔥 frequent</span>' : '',
        q.tags.includes('resume') ? '<span class="q-tag tag-resume">resume-mapped</span>' : '',
        q.tags.includes('design') ? '<span class="q-tag tag-design">system design</span>' : ''
      ].filter(Boolean).join(' ');

      html += `<li class="q-item">
        <span class="q-num">${i+1}.</span>
        <div style="flex:1">
          <div class="q-text">${q.text}</div>
          ${tagHtml ? `<div style="display:flex;gap:4px;flex-wrap:wrap;margin-top:4px;">${tagHtml}</div>` : ''}
        </div>
      </li>`;
    });

    html += `</ul></div>`;
  });

  if (!html) html = '<div class="empty">No questions match your search.</div>';
  content.innerHTML = html;
  document.getElementById('total-count').textContent = totalVisible;
}

render();
